  const fin=()=>{if(nw){const id=Math.max(0,...C.map(x=>x.id))+1;C.push({id,slug:sl||slug(o.name),av:AVT||'',...o});save();toast('Cliente criado');WT='feed';location.hash='#/admin/c/'+id}
  else{Object.assign(FC,o);if(sl)FC.slug=sl;if(AVT)FC.av=AVT;save();toast('Cliente salvo');admin()}};
  if(goPub)return askPw(o.name,o.pw,pw=>{o.pw=pw;fin()});fin()}
 else if(a==='x:dup'){const p=P.find(x=>x.id==t.dataset.p),o=JSON.parse(JSON.stringify(p,(k,v)=>k==='video'?undefined:v));o.id=++n;o.v=false;o.st='pending';o.rev=[];o.rv=1;o.video=p.video;P.push(o);save();toast('Post duplicado como rascunho');admin()}
 else if(a==='x:vis'){const p=P.find(x=>x.id==t.dataset.p);p.v=p.v===false;save();admin()}
 else if(a==='x:del'){if(confirm('Excluir esta publicação? Não dá para desfazer.')){const i=P.findIndex(x=>x.id==t.dataset.p);P.splice(i,1);SEL.delete(+t.dataset.p);save();admin()}}
 else if(a==='x:batch'){SEL.forEach(id=>{const p=P.find(x=>x.id===id);if(p)p.v=true});SEL.clear();save();toast('Posts tornados visíveis');admin()}
 else if(d){
  if(a==='x:psave')pSave(t.dataset.v==='1');
  else if(a==='x:pcancel'){const cid=PE.cid;PE=null;location.hash='#/admin/c/'+cid}
  else if(a==='x:mrm'){d.slides.splice(+t.dataset.i,1);d.sr.splice(+t.dataset.i,1);if(d.type==='story'){d.video=null;d.vname='';d.vdur=0}admin()}
  else if(a==='x:mup'||a==='x:mdn'){const i=+t.dataset.i,j=a==='x:mup'?i-1:i+1;if(j>=0&&j<d.slides.length){[d.slides[i],d.slides[j]]=[d.slides[j],d.slides[i]];[d.sr[i],d.sr[j]]=[d.sr[j],d.sr[i]]}admin()}
  else if(a==='x:msample'){const r=pr(d);if(d.type==='carousel'&&d.slides.length>=20){toast('Máximo de 20 itens.');return}const u=art(Math.floor(Math.random()*8),'Exemplo '+(d.slides.length+1),1080,Math.round(1080/r));if(d.type==='carousel'){d.slides.push(u);d.sr.push(r)}else{d.slides=[u];d.sr=[r];if(d.type==='story'){d.video=null;d.vname='';d.vdur=0}}admin()}
  else if(a==='x:vsim'){d.vsim=1;d.video=null;d.vname='';d.vdur=0;d.frame=0;admin()}
  else if(a==='x:csample'){d.cover=art(Math.floor(Math.random()*8),'Capa',1080,1920);d.cvr=9/16;d.cx=d.cy=50;admin()}
  else if(a==='x:frame'){d.frame=d.frame?0:1;admin()}
  else if(a==='x:fgrab'){const v=$('#fv');if(v&&v.videoWidth){const g=grab(v,v.videoWidth,v.videoHeight);d.cover=g.u;d.cvr=g.r;d.cx=d.cy=50;d.frame=0;admin()}else toast('Aguarde o vídeo carregar.')}}}
document.addEventListener('input',e=>{const t=e.target,k=t.dataset;
 if(t.id==='aq'){AQ=t.value;const l=$('#cl');if(l)l.innerHTML=cards();return}
 if(t.id==='fr'){const v=$('#fv');if(v)v.currentTime=+t.value;return}
 if(PE&&k.pe&&k.pe!=='type'&&k.pe!=='ar'){PE.d[k.pe]=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;if(k.pe==='cap'){const cc=$('#cc');if(cc)cc.textContent=t.value.length+'/2200'}pvDraw()}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset;
 if(t.id==='imp'){const f=t.files[0];t.value='';if(f)importData(f);return}
 if(k.ch==='st'){const c=C.find(x=>x.id==k.id),v=t.value;
  if(v==='published'&&c.status!=='published'){askPw(c.name,c.pw,pw=>{c.pw=pw;c.status='published';save();toast('Publicado. Senha definida.');dash()},()=>dash());return}
  if(v==='archived'&&!confirm('Arquivar '+c.name+'? O cliente perde o acesso ao link.')){dash();return}
  c.status=v;save();dash()}
 else if(k.ch==='pft'){PF.t=t.value;admin()}else if(k.ch==='pfs'){PF.s=t.value;admin()}
 else if(k.sel){const id=+k.sel;t.checked?SEL.add(id):SEL.delete(id);admin()}
 else if(k.up&&(PE||k.up==='avatar'))onUp(t);
 else if(PE&&k.pe==='type'){const d=PE.d,old=d.type;d.type=t.value;if(old!==d.type){d.slides=[];d.sr=[];d.cover=null;d.video=null;d.vsim=0;d.vname='';d.cx=d.cy=50;d.frame=0;d.ar=(d.type==='reel'||d.type==='story')?'9:16':(d.ar==='9:16'?'4:5':d.ar)}admin()}
 else if(PE&&k.pe==='ar'){PE.d.ar=t.value;admin()}});
addEventListener('storage',e=>{if(e.key!==SK||$('#ov').classList.contains('on'))return;const{s}=route();if(ADM&&s[0]==='admin'&&s[1]==='c'&&s[3]==='p')return;if(load())render()});
addEventListener('hashchange',()=>{if(!$('#ov').classList.contains('on'))render()});load();render();
</script></body></html>
